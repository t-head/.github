name: AI Code Review (Copilot Gate)

on:
  workflow_call:

# No permissions block on purpose: a called workflow can only keep or narrow the caller's
# GITHUB_TOKEN scopes, so callers that grant pull-requests: write let the gate request Copilot.

jobs:
  ai-code-review:
    name: AI Code Review (Copilot Gate)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Wait for Copilot review
        run: |
          set -euo pipefail

          # Guard: PR context must be available (inherited from caller's event).
          if [ -z "${PR_NUMBER}" ]; then
            echo "::error::No pull_request context available (github.event.pull_request.number is empty)."
            echo "::error::This reusable workflow must be called from a pull_request / pull_request_review triggered workflow."
            exit 1
          fi

          POLL_INTERVAL=20
          MAX_WAIT=1800  # 30 minutes
          ELAPSED=0
          # The ruleset requests Copilot within seconds of a PR opening; only step in once that window has passed.
          REQUEST_GRACE=60
          REQUEST_CHECKED=0

          echo "🤖 Waiting for Copilot code review on PR #${PR_NUMBER}..."
          echo ""

          while true; do
            REVIEWS_JSON=$(gh api --paginate --slurp \
              "repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" | jq 'add // []')

            # Check for Copilot review: user.login matches copilot-pull-request-reviewer[bot] or copilot
            COPILOT_REVIEW=$(echo "$REVIEWS_JSON" | jq -r '
              [ .[] | select(.user.login == "copilot-pull-request-reviewer[bot]" or .user.login == "copilot") ]
              | sort_by(.submitted_at) | last // empty
            ')

            if [ -n "$COPILOT_REVIEW" ] && [ "$COPILOT_REVIEW" != "null" ]; then
              REVIEW_TIME=$(echo "$COPILOT_REVIEW" | jq -r '.submitted_at')
              REVIEW_STATE=$(echo "$COPILOT_REVIEW" | jq -r '.state')
              REVIEW_USER=$(echo "$COPILOT_REVIEW" | jq -r '.user.login')
              echo "✅ Copilot review detected!"
              echo "   Reviewer: ${REVIEW_USER}"
              echo "   State: ${REVIEW_STATE}"
              echo "   Submitted at: ${REVIEW_TIME}"
              exit 0
            fi

            # A pending Copilot review is not listed in requested_reviewers, so the timeline is the only
            # reliable record of whether the ruleset (or anyone) has already asked Copilot.
            if [ "$REQUEST_CHECKED" = 0 ]; then
              if ! PR_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}"); then
                REQUEST_CHECKED=1
                echo "::warning::Cannot read PR #${PR_NUMBER}; skipping the Copilot request fallback."
              elif [ $(( $(date +%s) - $(echo "$PR_JSON" | jq -r '.created_at | fromdateiso8601') )) -ge "$REQUEST_GRACE" ]; then
                REQUEST_CHECKED=1
                if ! TIMELINE_JSON=$(gh api --paginate --slurp "repos/${REPO}/issues/${PR_NUMBER}/timeline?per_page=100"); then
                  echo "::warning::Cannot read the PR timeline; skipping the Copilot request fallback."
                elif [ "$(echo "$TIMELINE_JSON" | jq '[ add // [] | .[]
                      | select(.event == "review_requested"
                               and ((.requested_reviewer.login // "") | ascii_downcase
                                    | IN("copilot", "copilot-pull-request-reviewer", "copilot-pull-request-reviewer[bot]"))) ]
                      | length')" -eq 0 ]; then
                  echo "  🔁 Copilot was never requested on this PR, requesting it once."
                  # The REST review-request endpoint answers 201 even when Copilot refuses; GraphQL reports why.
                  REQUEST_RESULT=$(gh api graphql -f id="$(echo "$PR_JSON" | jq -r '.node_id')" \
                    -f query='mutation($id: ID!) { requestCopilotCodeReview(input: {pullRequestId: $id}) { success failureReason } }' \
                    2>&1) || true
                  REQUEST_SUCCESS=$(echo "$REQUEST_RESULT" | jq -r '.data.requestCopilotCodeReview.success // false' 2>/dev/null || true)
                  REQUEST_REASON=$(echo "$REQUEST_RESULT" | jq -r '.data.requestCopilotCodeReview.failureReason // empty' 2>/dev/null || true)
                  # Workflow commands end at the first newline, so keep the whole diagnostic on one line.
                  REQUEST_DETAIL=$(echo "$REQUEST_RESULT" | tr '\n' ' ')
                  if [ "$REQUEST_SUCCESS" = true ]; then
                    echo "  ✅ Copilot review requested."
                  elif [ -n "$REQUEST_REASON" ]; then
                    echo "::warning::Copilot declined the review request (${REQUEST_REASON}). Check the organization's Copilot code review settings, or request Copilot manually."
                  else
                    echo "::warning::Could not call the Copilot review API: ${REQUEST_DETAIL}| The caller must grant pull-requests: write (fork PRs are always read-only); request Copilot manually."
                  fi
                fi
              fi
            fi

            ELAPSED=$((ELAPSED + POLL_INTERVAL))
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo ""
              echo "::error::⏰ Timeout: Copilot review not detected after ${MAX_WAIT}s."
              echo "::error::Copilot 尚未提交评审。Copilot 提交评审后会通过 pull_request_review 事件自动重跑此 workflow。"
              exit 1
            fi

            echo "  ⏳ [${ELAPSED}s/${MAX_WAIT}s] Copilot review not yet available, retrying in ${POLL_INTERVAL}s..."
            sleep "$POLL_INTERVAL"
          done
