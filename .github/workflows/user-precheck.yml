name: Organization PR Precheck

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  # ═══════════════════════════════════════════════════
  # Secret scanning: fail on verified/unknown/unverified leaked credentials
  # Keyword checking has been moved to local git hooks (pre-commit / commit-msg)
  # ═══════════════════════════════════════════════════
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS secret scan
        uses: trufflesecurity/trufflehog@54c65cdab9424de442c2d4a776d5da3db863d73e
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown,unverified
