name: Test Human Review Gate

on:
  pull_request:
    paths:
      - .github/workflows/human-review.yml
      - .github/workflows/test-human-review.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/human-review.yml
      - .github/workflows/test-human-review.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test Human Review Gate
    runs-on: ubuntu-latest
    env:
      GATE_SCRIPT: ${{ runner.temp }}/gate.sh
      STUBS: ${{ runner.temp }}/stubs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract gate script and stubs
        run: |
          set -euo pipefail
          yq -e '.jobs["human-review"].steps[] | select(.name == "Wait for human approval") | .run' \
            .github/workflows/human-review.yml > "$GATE_SCRIPT"

          mkdir -p "$STUBS"
          # The gate only sleeps when no approval was found, so exit 99 means "still waiting".
          printf '#!/bin/sh\nexit 99\n' > "$STUBS/sleep"
          cat > "$STUBS/gh" <<'EOF'
          #!/usr/bin/env bash
          if [ "${GH_FAIL:-0}" = 1 ]; then
            echo "gh: Server Error (HTTP 500)" >&2
            exit 1
          fi
          expected="api --paginate --slurp repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100"
          if [ "$*" != "$expected" ]; then
            echo "unexpected gh call: $*" >&2
            exit 2
          fi
          cat "$GH_FIXTURE"
          EOF
          chmod +x "$STUBS/sleep" "$STUBS/gh"

      - name: Scenario tests
        run: |
          set -euo pipefail
          FAILED=0

          # Each spec is login:type:state, in submission order; output is split into 100-item pages.
          fixture() {
            jq -nc '[$ARGS.positional | to_entries[] | (.value | split(":")) as [$u, $t, $s]
                     | {user: {login: $u, type: $t}, state: $s, submitted_at: (1767225600 + .key * 60 | todate)}]
                    | if length == 0 then [[]] else [range(0; length; 100) as $i | .[$i:$i + 100]] end' \
              --args "$@" > "$RUNNER_TEMP/fixture.json"
          }

          fillers() {
            for i in $(seq 1 "$1"); do echo "filler$i:User:COMMENTED"; done
          }

          # Usage: run_case <name> <expected exit> [specs...]; PR / GH_FAIL may be overridden per call.
          run_case() {
            local name=$1 expected=$2 actual
            shift 2
            fixture "$@"
            set +e
            PATH="$STUBS:$PATH" GH_FIXTURE="$RUNNER_TEMP/fixture.json" GH_FAIL="${GH_FAIL:-0}" \
              PR_NUMBER="${PR-42}" REPO=t-head/test bash "$GATE_SCRIPT" > "$RUNNER_TEMP/out.log" 2>&1
            actual=$?
            set -e
            if [ "$actual" = "$expected" ]; then
              echo "✓ ${name} (exit ${actual})"
            else
              echo "::error::✗ ${name}: expected exit ${expected}, got ${actual}"
              echo "::group::${name} output"; cat "$RUNNER_TEMP/out.log"; echo "::endgroup::"
              FAILED=1
            fi
          }

          APPROVED=0 WAITING=99 ERROR=1

          run_case "no reviews" $WAITING
          run_case "single approval" $APPROVED alice:User:APPROVED
          run_case "approval on page 2" $APPROVED $(fillers 100) alice:User:APPROVED
          run_case "changes requested on page 2 overrides approval" $WAITING \
            alice:User:APPROVED $(fillers 99) alice:User:CHANGES_REQUESTED
          run_case "comment after approval keeps approval" $APPROVED alice:User:APPROVED alice:User:COMMENTED
          run_case "re-approval after changes requested" $APPROVED alice:User:CHANGES_REQUESTED alice:User:APPROVED
          run_case "dismissed approval" $WAITING alice:User:DISMISSED
          run_case "bot approval ignored" $WAITING copilot:Bot:APPROVED
          run_case "one of two reviewers approves" $APPROVED alice:User:CHANGES_REQUESTED bob:User:APPROVED
          GH_FAIL=1 run_case "API failure" $ERROR
          PR="" run_case "missing PR context" $ERROR

          exit "$FAILED"

      - name: Live API check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/sleep-only"
          cp "$STUBS/sleep" "$RUNNER_TEMP/sleep-only/sleep"
          PATH="$RUNNER_TEMP/sleep-only:$PATH" bash "$GATE_SCRIPT"
          code=$?
          case "$code" in
            0) echo "✓ Gate passed against the real API (PR already approved)" ;;
            99) echo "✓ Gate reached the polling wait against the real API (no approval yet)" ;;
            *) echo "::error::Gate failed against the real API with exit ${code}"; exit 1 ;;
          esac
